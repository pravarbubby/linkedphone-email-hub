ification is complete.\u003c/p>\n    \u003c/td>\n  \u003c/tr>\n\u003c/table>\n  \u003c/td>\u003c/tr>\n\u003c/table>\n\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n  \u003ctr>\u003ctd class=\"sm-px\" style=\"padding-top:28px;padding-bottom:0px;padding-left:20px;padding-right:20px;word-break:break-word\">\n\u003cp class=\"dm-text\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.2;font-weight:500;color:#171a2b;padding-bottom:16px\">Hi {{first_name}},\u003c/p>\u003cp class=\"dm-text-2 sm-deck\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:0px\">Toll-free numbers need a separate carrier verification before they can send text messages. Unverified toll-free traffic is blocked by US carriers.\u003c/p>\n  \u003c/td>\u003c/tr>\n\u003c/table>\n\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n  \u003ctr>\u003ctd class=\"sm-px\" style=\"padding-top:24px;padding-bottom:0px;padding-left:20px;padding-right:20px;word-break:break-word\">\n\u003ch2 class=\"dm-text sm-h2\" style=\"margin:0;font-family:'ES Rebond Grotesque','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:24px;line-height:1.2;font-weight:600;color:#171a2b;padding-top:0px;padding-bottom:16px\">What you'll need\u003c/h2>\n\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"margin-bottom:16px;\">\n\n  \u003ctr>\n    \u003ctd valign=\"top\" width=\"18\" class=\"dm-accent\" style=\"color:#3356ff;font-size:16px;line-height:1.6;padding-bottom:8px;width:18px\">&bull;\u003c/td>\n    \u003ctd valign=\"top\" class=\"dm-text-2\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:8px\">Your legal business name, address, and website.\u003c/td>\n  \u003c/tr>\n  \u003ctr>\n    \u003ctd valign=\"top\" width=\"18\" class=\"dm-accent\" style=\"color:#3356ff;font-size:16px;line-height:1.6;padding-bottom:8px;width:18px\">&bull;\u003c/td>\n    \u003ctd valign=\"top\" class=\"dm-text-2\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:8px\">The opt-in method your customers use to consent to texts.\u003c/td>\n  \u003c/tr>\n  \u003ctr>\n    \u003ctd valign=\"top\" width=\"18\" class=\"dm-accent\" style=\"color:#3356ff;font-size:16px;line-height:1.6;padding-bottom:8px;width:18px\">&bull;\u003c/td>\n    \u003ctd valign=\"top\" class=\"dm-text-2\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:8px\">A sample message and your estimated monthly volume.\u003c/td>\n  \u003c/tr>\n\u003c/table>\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"margin-bottom:0px;text-align:left;\">\n\u003ctr>\u003ctd style=\"padding:12px 0 20px;\">\u003ctable role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\u003ctr>\u003ctd width=\"36\" valign=\"middle\">\u003cimg class=\"lt-only\" src=\"../assets/img/icon-question.png\" width=\"24\" height=\"24\" alt=\"\" style=\"width:24px;height:24px;\">\u003cimg class=\"dk-only\" src=\"../assets/img/icon-question-dark.png\" width=\"24\" height=\"24\" alt=\"\" style=\"display:none;width:24px;height:24px;\">\u003c/td>\u003ctd>\u003ch2 class=\"dm-text sm-h2\" style=\"margin:0;font-family:'ES Rebond Grotesque','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-siz ;width:28px;height:28px;\">\u003c/td>\u003ctd style=\"padding-left:14px;\">\u003cp class=\"dm-accent\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;line-height:1.2;font-weight:500;letter-spacing:0.08em;color:#3356ff;padding-bottom:0px\">Security\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\n  \u003c/td>\u003c/tr>\n\u003c/table>\n\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n  \u003ctr>\u003ctd class=\"sm-px\" style=\"padding-top:20px;padding-bottom:0px;padding-left:20px;padding-right:20px;word-break:break-word\">\n\u003ch1 class=\"dm-text sm-h1\" style=\"margin:0;font-family:'ES Rebond Grotesque','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:32px;line-height:1.2;font-weight:600;color:#171a2b;padding-bottom:0px\">Your verification code\u003c/h1>\n  \u003c/td>\u003c/tr>\n\u003c/table>\n\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n  \u003ctr>\u003ctd class=\"sm-px\" style=\"padding-top:28px;padding-bottom:0px;padding-left:20px;padding-right:20px;word-break:break-word\">\n\u003cp class=\"dm-text-2 sm-deck\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:0px\">Enter this code to finish signing in to LinkedPhone.\u003c/p>\n  \u003c/td>\u003c/tr>\n\u003c/table>\n\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n  \u003ctr>\u003ctd class=\"sm-px\" style=\"padding-top:24px;padding-bottom:0px;padding-left:20px;padding-right:20px;word-break:break-word\">\n\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"margin-bottom:16px;\">\n  \u003ctr>\n    \u003ctd align=\"center\" class=\"dm-tile\" style=\"background-c :24px;\">\u003cdiv style=\"border-top:1px dashed #dfe1f8;\" class=\"dm-stroke\">\u003c/div>\u003c/td>\u003c/tr>\u003ctr>\u003ctd style=\"padding-top:24px;\">\u003cp class=\"dm-text-2\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:12px\">Thanks,\u003c/p>\u003cp class=\"dm-text-2\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:0px\">\u003cstrong class=\"dm-text\" style=\"color:#171a2b;\">Team LinkedPhone\u003c/strong>\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\n  \u003c/td>\u003c/tr>\n\u003c/table>\n\n  \u003c/td>\u003c/tr>\n\u003c/table>\n\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\u003ctr>\u003ctd class=\"sm-px\" style=\"padding:0 20px 24px;\">\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\u003ctr>\u003ctd class=\"dm-stroke\" style=\"padding-top:24px;border-top:1px solid #dfe1f8;\">\n\u003cp class=\"dm-text-3\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;line-height:1.5;font-weight:400;color:#5c5d71;padding-bottom:10px\">&copy; 2026 LinkedPhone. {{company_address}}\u003c/p>\n\u003cp class=\"dm-text-3\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;line-height:1.5;font-weight:400;color:#5c5d71;padding-bottom:10px\">This email was sent to {{email}} because of activity on your LinkedPhone account.\u003c/p>\n\u003cp class=\"dm-text-3\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;line-height:1.5;font-weight:600;color:#5c5d71\">\u003ca href=\"https://www.linkedp
