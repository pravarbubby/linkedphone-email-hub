\">\u003ctr>\u003ctd class=\"sm-px\" style=\"padding:0 20px;\">\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" class=\"dm-surface\" style=\"background:#eff0fe;border-radius:24px;overflow:hidden;\">\n\u003ctr>\u003ctd class=\"sm-hero-title\" align=\"center\" style=\"padding:28px 28px 12px;\">\u003ch1 class=\"dm-text sm-h1\" style=\"margin:0;font-family:'ES Rebond Grotesque','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:32px;line-height:1.2;font-weight:600;color:#171a2b;padding-bottom:0px\">You're two minutes from your first business call.\u003c/h1>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"font-size:0;line-height:0;\">\u003cdiv class=\"hero-desktop\">\n\u003c!-- IMAGE PLACEHOLDER [hero] First call hero (560x260, 28:13)\n     Swap BOTH src values for the final artwork, exported at 2x (1120x520):\n       light  ->  https://YOUR-CDN/first-call-hero.png\n       dark   ->  https://YOUR-CDN/first-call-hero-dark.png\n     Keep the width and height attributes exactly as they are - they are what\n     stop the layout reflowing while the image loads.\n     If you only have one version, delete the second (.dk-only) image tag and\n     drop the .lt-only class; the remaining one shows in both themes.\n-->\n\u003cimg class=\"lt-only sm-img\" src=\"../assets/img/ph-hero-first-call-hero.png\" width=\"560\" height=\"260\" alt=\"LinkedPhone First call product illustration\" style=\"display:block;width:100%;max-width:560px;height:auto;border:0\">\n\u003cimg class=\"dk-only sm-img\" src=\"../assets/img/ph-hero-first-call-hero-dark.png\" width=\"560\" height=\"260\" alt=\"LinkedPhone First call product illustration\" style=\"display:block;width:100%;max-width:560px;height:auto;border:0;display:none;\">\u003c/div>\u003c!--[if !mso]>\u003c!-->\u003cdiv class=\"hero-mobile\" style=\"display:none;max-height:0;overflow:hidden;mso-hide:all;\">\n\u003c!-- IMAGE PLACEHOLDER [hero] First call hero mobile (335x260, 28:13)\n     Swap BOTH src values for the final artwork, exported at 2x (670x520):\n       light  ->  https://YOUR-CDN/first-call-hero-mobile.png\n       dark   ->  https://YOUR-CDN/first-call-hero-mobile-dark.png\n     Keep the width and height attributes exactly as they are - they are what\n     stop the layout reflowing while the image loads.\n     If you only have one version, delete the second (.dk-only) image tag and\n     drop the .lt-only class; the remaining one shows in both themes.\n-->\n\u003cimg class=\"lt-only sm-img\" src=\"../assets/img/ph-hero-first-call-hero-mobile.png\" width=\"335\" height=\"260\" alt=\"LinkedPhone First call product illustration\" style=\"display:block;width:100%;max-width:335px;height:auto;border:0\">\n\u003cimg class=\"dk-only sm-img\" src=\"../assets/img/ph-hero-first-call-hero-mobile-dark.png\" width=\"335\" height=\"260\" alt=\"LinkedPhone First call product illustration\" style=\"display:block;width:100%;max-width:335px;height:auto;border:0;display:none;\">\u003c/div>\u003c!--\u003c![endif]-->\u003c/td>\u003c/tr>\n\u003c/table>\u003c/td>\u003c/tr>\u003c/table>\n\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n  \u003ctr>\u003ctd class=\"sm-px\" style=\"padding-top:28px;padding-bottom:0px;padding-left:20px;padding-right:20px;word-break:break-word\">\n\u003cp class=\"dm-text\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.2;font-weight:500;color:#171a2b;padding-bottom:16px\">Hi {{first_name}},\u003c/p>\u003cp class=\"dm-text-2 sm-deck\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:0px\">Welcome aboard. You've already picked your business number, so the hard part is behind you. Now let's get you managing your business from anywhere.\u003c/p>\n  \u003c/td>\u003c/tr>\n\u003c/table>\n\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n  \u003ctr>\u003ctd class=\"sm-px\" style=\"padding-top:24px;padding-bottom:0px;padding-left:20px;padding-right:20px;word-break:break-word\">\n\u003cp class=\"dm-text-2\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:8px\">\u003cstrong>Download the App\u003c/strong>\u003c/p>\n\n\u003ctable role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"margin-bottom:20px;\">\n\u003ctr>\u003ctd class=\"sm-store\" valign=\"middle\" style=\"padding-right:12px;\">\n\u003ca href=\"https://apps.apple.com/us/app/linkedphone-pro-business-line/id1304985788\">\u003cimg src=\"../assets/img/app-store-badge.png\" width=\"132\" height=\"44\" alt=\"App Store\" style=\"width:132px;height:44px;\">\u003c/a>\n\u003c/td>\u003ctd class=\"sm-store\" valign=\"middle\">\u003ca href=\"https://play.google.com/store/apps/details?id=com.admin.linkedphone\">\u003cimg src=\"../assets/img/google-play-badge.png\" width=\"172\" height=\"67\" alt=\"Google Play\" style=\"width:172px;height:auto;\">\u003c/a>\u003c/td>\u003c/tr>\u003c/table>\n\u003cp class=\"dm-text-2\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:16px\">Already installed? Great! Remember you also have access to \u003ca href=\"https://app.linkedphone.com\" class=\"dm-accent\" style=\"color:#3356ff;text-decoration:underline;font-weight:500\">LinkedPhone Web\u003c/a> so you can work from your computer.\u003c/p>\n\u003ch2 class=\"dm-text sm-h2\" style=\"margin:0;font-family:'ES Rebond Grotesque','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:24px;line-height:1.2;font-weight:600;color:#171a2b;padding-top:16px;padding-bottom:16px\">Three quick steps, in under two minutes. Let’s go!\u003c/h2>\n\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n\u003ctr>\u003ctd style=\"padding-bottom:24px;\">\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" class=\"dm-surface\" style=\"background:#eff0fe;border-radius:20px;table-layout:fixed;\">\n\u003ctr>\u003ctd class=\"sm-step-pad\" style=\"padding:24px 24px 20px;text-align:left;\">\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\u003ctr>\n\u003ctd width=\"44\" valign=\"top\" style=\"width:44px;padding-top:1px;\">\u003ctable role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\u003ctr>\u003ctd align=\"center\" class=\"dm-step-number\" width=\"28\" height=\"28\" style=\"background:#171a2b;color:#ffffff;border-radius:50%;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:28px;font-weight:600;\">1\u003c/td>\u003c/tr>\u003c/table>\u003c/td>\n\u003ctd valign=\"top\">\u003ch2 class=\"dm-text\" style=\"margin:0;font-family:'ES Rebond Grotesque','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:20px;line-height:1.4;font-weight:600;color:#171a2b;padding-bottom:0;text-align:left\">Turn on your app permissions.\u003c/h2>\u003c/td>\n\u003c/tr>\u003c/table>\n\u003cdiv style=\"padding-top:16px;\">\u003cp class=\"dm-text-2\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:0px\">These get everything working before your first call:\u003c/p>\u003c/div>\n\u003cdiv style=\"padding-top:16px;\">\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\u003ctr>\u003ctd class=\"dm-stroke\" style=\"padding:12px 0;border-top:1px solid #dfe1f8;\">\u003cp class=\"dm-text-2\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:0px\">\u003cstrong class=\"dm-text\" style=\"color:#171a2b;\">Notifications,\u003c/strong> so you never miss a business call, text, or voicemail.\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\u003ctr>\u003ctd class=\"dm-stroke\" style=\"padding:12px 0;border-top:1px solid #dfe1f8;\">\u003cp class=\"dm-text-2\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:0px\">\u003cstrong class=\"dm-text\" style=\"color:#171a2b;\">Contacts,\u003c/strong> so you see familiar names instead of strings of numbers.\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\u003ctr>\u003ctd class=\"dm-stroke\" style=\"padding:12px 0;border-top:1px solid #dfe1f8;\">\u003cp class=\"dm-text-2\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:0px\">\u003cstrong class=\"dm-text\" style=\"color:#171a2b;\">Microphone,\u003c/strong> so you can talk with customers and record greetings.\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:0 16px 16px;font-size:0;line-height:0;\">\n\u003c!-- IMAGE PLACEHOLDER [thumb] Permissions screen (536x300, 134:75)\n     Swap BOTH src values for the final artwork, exported at 2x (1072x600):\n       light  ->  https://YOUR-CDN/permissions-screen.png\n       dark   ->  https://YOUR-CDN/permissions-screen-dark.png\n     Keep the width and height attributes exactly as they are - they are what\n     stop the layout reflowing while the image loads.\n     If you only have one version, delete the second (.dk-only) image tag and\n     drop the .lt-only class; the remaining one shows in both themes.\n-->\n\u003cimg class=\"lt-only sm-img\" src=\"../assets/img/ph-thumb-permissions-screen.png\" width=\"536\" height=\"300\" alt=\"Illustration: Permissions screen\" style=\"display:block;width:100%;max-width:536px;height:auto;border:0;border-radius:12px\">\n\u003cimg class=\"dk-only sm-img\" src=\"../assets/img/ph-thumb-permissions-screen-dark.png\" width=\"536\" height=\"300\" alt=\"Illustration: Permissions screen\" style=\"display:block;width:100%;max-width:536px;height:auto;border:0;border-radius:12px;display:none;\">\u003c/td>\u003c/tr>\n\u003c/table>\u003c/td>\u003c/tr>\u003ctr>\u003ctd style=\"padding-bottom:24px;\">\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" class=\"dm-surface\" style=\"background:#eff0fe;border-radius:20px;table-layout:fixed;\">\n\u003ctr>\u003ctd class=\"sm-step-pad\" style=\"padding:24px 24px 20px;text-align:left;\">\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\u003ctr>\n\u003ctd width=\"44\" valign=\"top\" style=\"width:44px;padding-top:1px;\">\u003ctable role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\u003ctr>\u003ctd align=\"center\" class=\"dm-step-number\" width=\"28\" height=\"28\" style=\"background:#171a2b;color:#ffffff;border-radius:50%;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:28px;font-weight:600;\">2\u003c/td>\u003c/tr>\u003c/table>\u003c/td>\n\u003ctd valign=\"top\">\u003ch2 class=\"dm-text\" style=\"margin:0;font-family:'ES Rebond Grotesque','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:20px;line-height:1.4;font-weight:600;color:#171a2b;padding-bottom:0;text-align:left\">Set your business hours.\u003c/h2>\u003c/td>\n\u003c/tr>\u003c/table>\n\u003cdiv style=\"padding-top:16px;\">\u003cp class=\"dm-text-2\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:0px\">Your business calls ring through only when you're open, so personal time remains yours. Pro tip: double-check your time zone in the app so calls come in only when you expect them to.\u003c/p>\u003c/div>\n\n\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:0 16px 16px;font-size:0;line-height:0;\">\n\u003c!-- IMAGE PLACEHOLDER [thumb] Business hours screen (536x300, 134:75)\n     Swap BOTH src values for the final artwork, exported at 2x (1072x600):\n       light  ->  https://YOUR-CDN/business-hours-screen.png\n       dark   ->  https://YOUR-CDN/business-hours-screen-dark.png\n     Keep the width and height attributes exactly as they are - they are what\n     stop the layout reflowing while the image loads.\n     If you only have one version, delete the second (.dk-only) image tag and\n     drop the .lt-only class; the remaining one shows in both themes.\n-->\n\u003cimg class=\"lt-only sm-img\" src=\"../assets/img/ph-thumb-business-hours-screen.png\" width=\"536\" height=\"300\" alt=\"Illustration: Business hours screen\" style=\"display:block;width:100%;max-width:536px;height:auto;border:0;border-radius:12px\">\n\u003cimg class=\"dk-only sm-img\" src=\"../assets/img/ph-thumb-business-hours-screen-dark.png\" width=\"536\" height=\"300\" alt=\"Illustration: Business hours screen\" style=\"display:block;width:100%;max-width:536px;height:auto;border:0;border-radius:12px;display:none;\">\u003c/td>\u003c/tr>\n\u003c/table>\u003c/td>\u003c/tr>\u003ctr>\u003ctd style=\"padding-bottom:24px;\">\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" class=\"dm-surface\" style=\"background:#eff0fe;border-radius:20px;table-layout:fixed;\">\n\u003ctr>\u003ctd class=\"sm-step-pad\" style=\"padding:24px 24px 20px;text-align:left;\">\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\u003ctr>\n\u003ctd width=\"44\" valign=\"top\" style=\"width:44px;padding-top:1px;\">\u003ctable role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\u003ctr>\u003ctd align=\"center\" class=\"dm-step-number\" width=\"28\" height=\"28\" style=\"background:#171a2b;color:#ffffff;border-radius:50%;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:28px;font-weight:600;\">3\u003c/td>\u003c/tr>\u003c/table>\u003c/td>\n\u003ctd valign=\"top\">\u003ch2 class=\"dm-text\" style=\"margin:0;font-family:'ES Rebond Grotesque','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:20px;line-height:1.4;font-weight:600;color:#171a2b;padding-bottom:0;text-align:left\">Make and receive your first call.\u003c/h2>\u003c/td>\n\u003c/tr>\u003c/table>\n\u003cdiv style=\"padding-top:16px;\">\u003cp class=\"dm-text-2\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:0px\">Here's the fun part. Call a friend or your own cell and watch your business caller ID appear. You'll see your notifications come through, and your personal number stays completely private.\u003c/p>\u003c/div>\n\n\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:0 16px 16px;font-size:0;line-height:0;\">\n\u003c!-- IMAGE PLACEHOLDER [thumb] Live call screen (536x300, 134:75)\n     Swap BOTH src values for the final artwork, exported at 2x (1072x600):\n       light  ->  https://YOUR-CDN/live-call-screen.png\n       dark   ->  https://YOUR-CDN/live-call-screen-dark.png\n     Keep the width and height attributes exactly as they are - they are what\n     stop the layout reflowing while the image loads.\n     If you only have one version, delete the second (.dk-only) image tag and\n     drop the .lt-only class; the remaining one shows in both themes.\n-->\n\u003cimg class=\"lt-only sm-img\" src=\"../assets/img/ph-thumb-live-call-screen.png\" width=\"536\" height=\"300\" alt=\"Illustration: Live call screen\" style=\"display:block;width:100%;max-width:536px;height:auto;border:0;border-radius:12px\">\n\u003cimg class=\"dk-only sm-img\" src=\"../assets/img/ph-thumb-live-call-screen-dark.png\" width=\"536\" height=\"300\" alt=\"Illustration: Live call screen\" style=\"display:block;width:100%;max-width:536px;height:auto;border:0;border-radius:12px;display:none;\">\u003c/td>\u003c/tr>\n\u003c/table>\u003c/td>\u003c/tr>\n\u003c/table>\n\u003cp class=\"dm-text-2\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:16px\">That's it. Now you're ready to run your business from anywhere.\u003c/p>\n\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"margin-bottom:20px;text-align:left;\">\u003ctr>\u003ctd class=\"dm-stroke\" style=\"border-top:1px solid #dfe1f8;padding:24px 0 8px;\">\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\u003ctr>\u003ctd width=\"60\" valign=\"top\" style=\"width:60px;\">\u003ctable role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\u003ctr>\u003ctd class=\"dm-surface\" style=\"padding:12px;background:#eff0fe;border-radius:12px;\">\u003cimg class=\"lt-only\" src=\"../assets/img/icon-calendar.png\" width=\"24\" height=\"24\" alt=\"\" style=\"width:24px;height:24px;\">\u003cimg class=\"dk-only\" src=\"../assets/img/icon-calendar-dark.png\" width=\"24\" height=\"24\" alt=\"\" style=\"display:none;width:24px;height:24px;\">\u003c/td>\u003c/tr>\u003c/table>\u003c/td>\u003ctd valign=\"top\" style=\"text-align:left;\">\u003cp class=\"dm-text-2\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:6px\">\u003cstrong class=\"dm-text\" style=\"color:#171a2b;\">Tomorrow\u003c/strong>\u003c/p>\u003cp class=\"dm-text-2\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:0px\">Learn how to set up business greetings for a professional call experience.\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\n\u003c/td>\u003c/tr>\u003c/table>\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"margin-bottom:20px;text-align:left;\">\n\u003ctr>\u003ctd style=\"padding:12px 0 20px;\">\u003ctable role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\u003ctr>\u003ctd width=\"36\" valign=\"middle\">\u003cimg class=\"lt-only\" src=\"../assets/img/icon-question.png\" width=\"24\" height=\"24\" alt=\"\" style=\"width:24px;height:24px;\">\u003cimg class=\"dk-only\" src=\"../assets/img/icon-question-dark.png\" width=\"24\" height=\"24\" alt=\"\" style=\"display:none;width:24px;height:24px;\">\u003c/td>\u003ctd>\u003ch2 class=\"dm-text sm-h2\" style=\"margin:0;font-family:'ES Rebond Grotesque','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:24px;line-height:1.2;font-weight:600;color:#171a2b;padding-top:0px;padding-bottom:0px\">Frequently asked questions\u003c/h2>\u003c/td>\u003c/tr>\u003c/table>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"dm-stroke\" style=\"padding:20px 0;border-top:1px solid #dfe1f8;\">\n\u003ch3 class=\"dm-text\" style=\"margin:0;font-family:'ES Rebond Grotesque','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:18px;line-height:1.45;font-weight:600;color:#171a2b;padding-bottom:12px;text-align:left\">Should I import my contacts into LinkedPhone?\u003c/h3>\n\u003cp class=\"dm-text-2\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:0px\">That’s completely up to you. Giving LinkedPhone access to your phone’s contacts lets you see familiar names instead of strings of numbers. Importing contacts is different: it adds customers, vendors, and other business contacts to LinkedPhone, so you and your team can easily find, call, or text them from your business number.\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\n  \u003c/td>\u003c/tr>\n\u003c/table>\n\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n  \u003ctr>\u003ctd class=\"sm-px\" style=\"padding-top:24px;padding-bottom:0px;padding-left:20px;padding-right:20px;word-break:break-word\">\n\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"margin-bottom:0px;\">\u003ctr>\u003ctd class=\"dm-stroke\" style=\"border:1px solid #dfe1f8;border-radius:20px;padding:24px;\">\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\u003ctr>\u003ctd>\u003cimg class=\"lt-only\" src=\"../assets/img/icon-support.png\" width=\"32\" height=\"32\" alt=\"\" style=\"width:32px;height:32px;\">\u003cimg class=\"dk-only\" src=\"../assets/img/icon-support-dark.png\" width=\"32\" height=\"32\" alt=\"\" style=\"display:none;width:32px;height:32px;\">\u003c/td>\u003ctd align=\"right\">\u003ca href=\"https://www.linkedphone.com/quick-start-guide\" aria-label=\"Open Quick Start Guide\">\u003cimg class=\"lt-only\" src=\"../assets/img/icon-arrow.png\" width=\"24\" height=\"24\ nj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;\n  \u003c/div>\n\n  \u003ctable role=\"presentation\" class=\"dm-canvas\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"background-color:#ffffff;width:100%\">\n    \u003ctr>\n      \u003ctd align=\"center\" class=\"sm-outer\" style=\"padding:24px 24px\">\n        \u003c!--[if mso]>\u003ctable role=\"presentation\" width=\"600\" align=\"center\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\u003ctr>\u003ctd>\u003c![endif]-->\n        \u003cdiv style=\"max-width:600px;margin:0 auto;\">\n\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n  \u003ctr>\n    \u003ctd align=\"center\" class=\"sm-px\" style=\"padding:8px 20px 28px;\">\n      \u003ca href=\"https://www.linkedphone.com\" style=\"text-decoration:none;display:inline-block;\">\n        \u003cimg class=\"lt-only\" src=\"../assets/wordmark-light.png\" width=\"158\" height=\"23\" alt=\"LinkedPhone\" style=\"display:block;border:0;width:158px;height:23px;\">\n        \u003cimg class=\"dk-only\" src=\"../assets/wordmark-dark.png\" width=\"158\" height=\"23\" alt=\"LinkedPhone\" style=\"display:none;border:0;width:158px;height:23px;\">\n      \u003c/a>\n    \u003c/td>\n  \u003c/tr>\n\u003c/table>\n\n\u003ctable role=\"presentation\" class=\"dm-card dm-stroke\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"table-layout:fixed;background-color:#ffffff;width:100%\">\n  \u003ctr>\u003ctd>\n\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\u003ctr>\u003ctd class=\"sm-px\" style=\"padding:0 20px;\">\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" class=\"dm-surface\" style=\"background:#eff0fe;border-radius:24px;overflow:hidden;\">\n\u003ctr>\u003ctd class=\"sm-hero-title\" align=\"center\" style=\"padding:28px 28px 12px;\">\u003ch1 class=\"dm-text sm-h1\" style=\"margin:0;font-family:'ES Rebond Grotesque','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:32px;line-height:1.2;font-weight:600;color:#171a2b;padding-bottom:0px\">Welcome your callers with professional business greetings.\u003c/h1>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"font-size:0;line-height:0;\">\u003cdiv class=\"hero-desktop\">\n\u003c!-- IMAGE PLACEHOLDER [hero] Greetings hero (560x260, 28:13)\n     Swap BOTH src values for the final artwork, exported at 2x (1120x520):\n       light  ->  https://YOUR-CDN/greetings-hero.png\n       dark   ->  https://YOUR-CDN/greetings-hero-dark.png\n     Keep the width and height attributes exactly as they are - they are what\n     stop the layout reflowing while the image loads.\n     If you only have one version, delete the second (.dk-only) image tag and\n     drop the .lt-only class; the remaining one shows in both themes.\n-->\n\u003cimg class=\"lt-only sm-img\" src=\"../assets/img/ph-hero-greetings-hero.png\" width=\"560\" height=\"260\" alt=\"LinkedPhone Greetings product illustration\" style=\"display:block;width:100%;max-width:560px;height:auto;border:0\">\n\u003cimg class=\"dk-only sm-img\" src=\"../assets/img/ph-hero-greetings-hero-dark.png\" width=\"560\" height=\"260\" alt=\"LinkedPhone Greetings product illustration\" style=\"display:block;width:100%;max-width:560px;height:auto;border:0;display:none;\">\u003c/div>\u003c!--[if !mso]>\u003c!-->\u003cdiv class=\"hero-mobile\" style=\"display:none;max-height:0;overflow:hidden;mso-hide:all;\">\n\u003c!-- IMAGE PLACEHOLDER [hero] Greetings hero mobile (335x260, 28:13)\n     Swap BOTH src values for the final artwork, exported at 2x (670x520):\n       light  ->  https://YOUR-CDN/greetings-hero-mobile.png\n       dark   ->  https://YOUR-CDN/greetings-hero-mobile-dark.png\n     Keep the width and height attributes exactly as they are - they are what\n     stop the layout reflowing while the image loads.\n     If you only have one version, delete the second (.dk-only) image tag and\n     drop the .lt-only class; the remaining one shows in both themes.\n-->\n\u003cimg class=\"lt-only sm-img\" src=\"../assets/img/ph-hero-greetings-hero-mobile.png\" width=\"335\" height=\"260\" alt=\"LinkedPhone Greetings product illustration\" style=\"display:block;width:100%;max-width:335px;height:auto;border:0\">\n\u003cimg class=\"dk-only sm-img\" src=\"../assets/img/ph-hero-greetings-hero-mobile-dark.png\" width=\"335\" height=\"260\" alt=\"LinkedPhone Greetings product illustration\" style=\"display:block;width:100%;max-width:335px;height:auto;border:0;display:none;\">\u003c/div>\u003c!--\u003c![endif]-->\u003c/td>\u003c/tr>\n\u003c/table>\u003c/td>\u003c/tr>\u003c/table>\n\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n  \u003ctr>\u003ctd class=\"sm-px\" style=\"padding-top:28px;padding-bottom:0px;padding-left:20px;padding-right:20px;word-break:break-word\">\n\u003cp class=\"dm-text\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.2;font-weight:500;color:#171a2b;padding-bottom:16px\">Hi {{first_name}},\u003c/p>\u003cp class=\"dm-text-2 sm-deck\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:0px\">Professional greetings tell callers they’ve reached the right place. Let’s set up the three greetings every business should have. Your Welcome Message plays before we ring your devices. Voicemail greetings play only when no one answers.\u003c/p>\n  \u003c/td>\u003c/tr>\n\u003c/table>\n\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n  \u003ctr>\u003ctd class=\"sm-px\" style=\"padding-top:24px;padding-bottom:0px;padding-left:20px;padding-right:20px;word-break:break-word\">\n\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n\u003ctr>\u003ctd style=\"padding-bottom:24px;\">\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" class=\"dm-surface\" style=\"background:#eff0fe;border-radius:20px;table-layout:fixed;\">\n\u003ctr>\u003ctd class=\"sm-step-pad\" style=\"padding:24px 24px 20px;text-align:left;\">\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\u003ctr>\n\u003ctd width=\"44\" valign=\"top\" style=\"width:44px;padding-top:1px;\">\u003ctable role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\u003ctr>\u003ctd align=\"center\" class=\"dm-step-number\" width=\"28\" height=\"28\" style=\"background:#171a2b;color:#ffffff;border-radius:50%;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:28px;font-weight:600;\">1\u003c/td>\u003c/tr>\u003c/table>\u003c/td>\n\u003ctd valign=\"top\">\u003ch2 class=\"dm-text\" style=\"margin:0;font-family:'ES Rebond Grotesque','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:20px;line-height:1.4;font-weight:600;color:#171a2b;padding-bottom:0;text-align:left\">Intro Greeting\u003c/h2>\u003c/td>\n\u003c/tr>\u003c/table>\n\u003cdiv style=\"padding-top:16px;\">\u003cp class=\"dm-text-2\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:16px\">The first thing callers hear. It's off by default, so calls ring straight through. Turn it on to play an intro first. \u003c/p>\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\u003ctr>\u003ctd class=\"dm-stroke\" style=\"padding:0 0 0 16px;border-left:2px solid #a6b5ff;\">\u003cp class=\"dm-text-2\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:0px\">\u003cem class=\"dm-text\" style=\"color:#171a2b;\">“Thanks for calling {{business_name}}. Please hold while we connect your call.”\u003c/em>\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\n\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:0 16px 16px;font-size:0;line-height:0;\">\n\u003c!-- IMAGE PLACEHOLDER [thumb] Intro greeting screen (536x160, 134:75)\n     Swap BOTH src values for the final artwork, exported at 2x (1072x320):\n       light  ->  https://YOUR-CDN/intro-greeting-screen.png\n       dark   ->  https://YOUR-CDN/intro-greeting-screen-dark.png\n     Keep the width and height attributes exactly as they are - they are what\n     stop the layout reflowing while the image loads.\n     If you only have one version, delete the second (.dk-only) image tag and\n     drop the .lt-only class; the remaining one shows in both themes.\n-->\n\u003cimg class=\"lt-only sm-img\" src=\"../assets/img/ph-thumb-intro-greeting-screen.png\" width=\"536\" height=\"160\" alt=\"Illustration: Intro greeting screen\" style=\"display:block;width:100%;max-width:536px;height:auto;border:0;border-radius:12px\">\n\u003cimg class=\"dk-only sm-img\" src=\"../assets/img/ph-thumb-intro-greeting-screen-dark.png\" width=\"536\" height=\"160\" alt=\"Illustration: Intro greeting screen\" style=\"display:block;width:100%;max-width:536px;height:auto;border:0;border-radius:12px;display:none;\">\u003c/td>\u003c/tr>\n\u003c/ n    \u003c/td>\n  \u003c/tr>\n\u003c/table>\n\n\u003ctable role=\"presentation\" class=\"dm-card dm-stroke\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"table-layout:fixed;background-color:#ffffff;width:100%\">\n  \u003ctr>\u003ctd>\n\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\u003ctr>\u003ctd class=\"sm-px\" style=\"padding:0 20px;\">\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" class=\"dm-surface\" style=\"background:#eff0fe;border-radius:24px;overflow:hidden;\">\n\u003ctr>\u003ctd class=\"sm-hero-title\" align=\"center\" style=\"padding:28px 28px 12px;\">\u003ch1 class=\"dm-text sm-h1\" style=\"margin:0;font-family:'ES Rebond Grotesque','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:32px;line-height:1.2;font-weight:600;color:#171a2b;padding-bottom:0px\">Send every call to the right place, automatically.\u003c/h1>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"font-size:0;line-height:0;\">\u003cdiv class=\"hero-desktop\">\n\u003c!-- IMAGE PLACEHOLDER [hero] Auto attendant hero (560x260, 28:13)\n     Swap BOTH src values for the final artwork, exported at 2x (1120x520):\n       light  ->  https://YOUR-CDN/auto-attendant-hero.png\n       dark   ->  https://YOUR-CDN/auto-attendant-hero-dark.png\n     Keep the width and height attributes exactly as they are - they are what\n     stop the layout reflowing while the image loads.\n     If you only have one version, delete the second (.dk-only) image tag and\n     drop the .lt-only class; the remaining one shows in both themes.\n-->\n\u003cimg class=\"lt-only sm-img\" src=\"../assets/img/ph-hero-auto-attendant-hero.png\" width=\"560\" height=\"260\" alt=\"LinkedPhone Auto attendant product illustration\" style=\"display:block;width:100%;max-width:560px;height:auto;border:0\">\n\u003cimg class=\"dk-only sm-img\" src=\"../assets/img/ph-hero-auto ing-bottom:16px\">Hi {{first_name}},\u003c/p>\u003cp class=\"dm-text-2 sm-deck\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:0px\">Today, let's make every caller feel like they reached a business with a full front desk.\u003cbr>\u003cbr>Your greetings welcome callers. Auto Attendant sends every call to the right place, like a receptionist that never takes a break. It’s an easy way to give your business a polished, professional phone experience without the cost and complexity of a traditional business phone system.\u003c/p>\n  \u003c/td>\u003c/tr>\n\u003c/table>\n\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n  \u003ctr>\u003ctd class=\"sm-px\" style=\"padding-top:24px;padding-bottom:0px;padding-left:20px;padding-right:20px;word-break:break-word\">\n\u003ch2 class=\"dm-text sm-h2\" style=\"margin:0;font-family:'ES Rebond Grotesque','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:24px;line-height:1.2;font-weight:600;color:#171a2b;padding-top:0px;padding-bottom:16px\">Here are three things to know:\u003c/h2>\n\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n\u003ctr>\u003ctd style=\"padding-bottom:24px;\">\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" class=\"dm-surface\" style=\"background:#eff0fe;border-radius:20px;table-layout:fixed;\">\n\u003ctr>\u003ctd class=\"sm-step-pad\" style=\"padding:24px 24px 20px;text-align:left;\">\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\u003ctr>\n\u003ctd width=\"44\" valign=\"top\" style=\"width:44px;padding-top:1px;\">\u003ctable role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\u003ctr>\u003ctd align=\"center\" class=\"dm-step-number\" width=\"28\" height=\"28\" style=\"background:#171a2b;color:#ffffff;border-radius:50%;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:28px;font-weight:600;\">1\u003c/td>\u003c/tr>\u003c/table>\u003c/td>\n\u003ctd valign=\"top\">\u003ch2 class=\"dm-text\" style=\"margin:0;font-family:'ES Rebond Grotesque','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:20px;line-height:1.4;font-weight:600;color:#171a2b;padding-bottom:0;text-align:left\">Phone Menu\u003c/h2>\u003c/td>\n\u003c/tr>\u003c/table>\n\u003cdiv style=\"padding-top:16px;\">\u003cp class=\"dm-text-2\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:16px\">Setting up a Phone Menu is optional. It lets callers choose how to get help. For example, \u003c/p>\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\u003ctr>\u003ctd class=\"dm-stroke\" style=\"padding:0 0 0 16px;border-left:2px solid #a6b5ff;\">\u003cp class=\"dm-text-2\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:0px\">\u003cem class=\"dm-text\" style=\"color:#171a2b;\">“Press 1 for Sales. Press 2 for hours and location. Press 3 for Customer Service.”\u003c/em>\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\u003cdiv style=\"padding-top:16px;\">\u003cp class=\"dm-text-2\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:0px\">From there, calls route to any person or team at your business.\u003c/p>\u003c/div>\u003c/div>\n\n\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:0 16px height:1.2;font-weight:600;color:#171a2b;padding-top:0px;padding-bottom:0px\">Frequently asked questions\u003c/h2>\u003c/td>\u003c/tr>\u003c/table>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"dm-stroke\" style=\"padding:20px 0;border-top:1px solid #dfe1f8;\">\n\u003ch3 class=\"dm-text\" style=\"margin:0;font-family:'ES Rebond Grotesque','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:18px;line-height:1.45;font-weight:600;color:#171a2b;padding-bottom:12px;text-align:left\">Do I have to update my Intro Greeting if I set up a Phone Menu?\u003c/h3>\n\u003cp class=\"dm-text-2\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:0px\">Yes. Include your Phone Menu options in your Intro Greeting so callers know what to press.\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\n\u003cp class=\"dm-text-2\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:0px\">It’s that easy to make your small business sound polished and professional.\u003c/p>\n  \u003c/td>\u003c/tr>\n\u003c/table>\n\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n  \u003ctr>\u003ctd class=\"sm-px\" style=\"padding-top:24px;padding-bottom:0px;padding-left:20px;padding-right:20px;word-break:break-word\">\n\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"margin-bottom:0px;text-align:left;\">\u003ctr>\u003ctd class=\"dm-stroke\" style=\"border-top:1px solid #dfe1f8;padding:24px 0 8px;\">\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\u003ctr>\u003ctd width=\"60\" valign=\"top\" style=\"width:60px;\">\u003ctable role=\"presentation\" cellpadding=\"0\" ce em,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:0px\">LinkedPhone works whether you’re solo or running a team. With a team, it’s easy to pick up where someone else left off.\u003cbr>\u003cbr>Your team can share one business phone number for calls, texts, and customer service. Everyone stays connected, and customer context stays in one place.\u003c/p>\n  \u003c/td>\u003c/tr>\n\u003c/table>\n\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n  \u003ctr>\u003ctd class=\"sm-px\" style=\"padding-top:24px;padding-bottom:0px;padding-left:20px;padding-right:20px;word-break:break-word\">\n\u003ch2 class=\"dm-text sm-h2\" style=\"margin:0;font-family:'ES Rebond Grotesque','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:24px;line-height:1.2;font-weight:600;color:#171a2b;padding-top:0px;padding-bottom:16px\">Here are three things to know:\u003c/h2>\n\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n\u003ctr>\u003ctd style=\"padding-bottom:24px;\">\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" class=\"dm-surface\" style=\"background:#eff0fe;border-radius:20px;table-layout:fixed;\">\n\u003ctr>\u003ctd class=\"sm-step-pad\" style=\"padding:24px 24px 20px;text-align:left;\">\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\u003ctr>\n\u003ctd width=\"44\" valign=\"top\" style=\"width:44px;padding-top:1px;\">\u003ctable role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\u003ctr>\u003ctd align=\"center\" class=\"dm-step-number\" width=\"28\" height=\"28\" style=\"background:#171a2b;color:#ffffff;border-radius:50%;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:28px;font-weight:600;\">1\u003c/td>\u003c/tr>\u003c/table>\u003c/td>\n\u003ctd valign=\"top\">\u003ch2 class=\"dm-text\" style=\"margin:0;font-family:'ES Rebond Grotesque','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:20px;line-height:1.4;font-weight:600;color:#171a2b;padding-bottom:0;text-align:left\">Add Team Members\u003c/h2>\u003c/td>\n\u003c/tr>\u003c/table>\n\u003cdiv style=\"padding-top:16px;\">\u003cp class=\"dm-text-2\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:0px\">Invite the people who help you run your business. Each team member gets access to the mobile app and LinkedPhone Web.\u003c/p>\u003c/div>\n\n\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:0 16px 16px;font-size:0;line-height:0;\">\n\u003c!-- IMAGE PLACEHOLDER [thumb] Invite team screen (536x300, 134:75)\n     Swap BOTH src values for the final artwork, exported at 2x (1072x600):\n       light  ->  https://YOUR-CDN/invite-team-screen.png\n       dark   ->  https://YOUR-CDN/invite-team-screen-dark.png\n     Keep the width and height attributes exactly as they are - they are what\n     stop the layout reflowing while the image loads.\n     If you only have one version, delete the second (.dk-only) image tag and\n     drop the .lt-only class; the remaining one shows in both themes.\n-->\n\u003cimg class=\"lt-only sm-img\" src=\"../assets/img/ph-thumb-invite-team-screen.png\" width=\"536\" height=\"300\" alt=\"Illustration: Invite team screen\" style=\"display:block;width:100%;max-width:536px;height:auto;border:0;border-radius:12px\">\n\u003cimg class=\"dk-only sm-img\" src=\"../assets/img/ph-thumb-invite-team-screen-dark.png\" width=\"536\" height=\"300\" alt=\"Illustration: Invite team screen\" style=\"display:block;width:100%;max-width:536px;height:auto;border:0;border-radius:12px;display:none;\">\u003c/td>\u003c/tr>\n\u003c/table>\u003c/td>\u003c/tr>\u003ctr>\u003ctd style=\"padding-bottom:24px;\">\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" class=\"dm-surface\" style=\"background:#eff0fe;border-radius:20px;table-layout:fixed;\">\n\u003ctr>\u003ctd class=\"sm-step-pad\" style=\"padding:24px 24px 20px;text-align:left;\">\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\u003ctr>\n\u003ctd width=\"44\" valign=\"top\" style=\"width:44px;padding-top:1px;\">\u003ctable role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\u003ctr>\u003ctd align=\"center\" class=\"dm-step-number\" width=\"28\" height=\"28\" style=\"background:#171a2b;color:#ffffff;border-radius:50%;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:28px;font-weight:600;\">2\u003c/td>\u003c/tr>\u003c/table>\u003c/td>\n\u003ctd valign=\"top\">\u003ch2 class=\"dm-text\" style=\"margin:0;font-family:'ES Rebond Grotesque','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:20px;line-height:1.4;font-weight:600;color:#171a2b;padding-bottom:0;text-align:left\">Share Calls and Texts\u003c/h2>\u003c/td>\n\u003c/tr>\u003c/table>\n\u003cdiv style=\"padding-top:16px;\">\u003cp class=\"dm-text-2\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:0px\">Your team can make and receive calls and send and receive texts, all from the same business number. Customers see one consistent number, no matter who on your team is helping them.\u003c/p>\u003c/div>\n\n\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:0 16px 16px;font-size:0;line-height:0;\">\n\u003c!-- IMAGE PLACEHOLDER [thumb] Shared number screen (536x300, 134:75)\n     Swap BOTH src values for the final artwork, exported at 2x (1072x600):\n       light  ->  https://YOUR-CDN/shared-number-screen.png\n       dark   ->  https://YOUR-CDN/shared-number-screen-dark.png\n     Keep the width and height attributes exactly as they are - they are what\n     stop the layout reflowing while the image loads.\n     If you only have one version, delete the second (.dk-only) image tag and\n     drop the .lt-only class; the remaining one shows in both themes.\n-->\n\u003cimg class=\"lt-only sm-img\" src=\"../assets/img/ph-thumb-shared-number-screen.png\" width=\"536\" height=\"300\" alt=\"Illustration: Shared number screen\" style=\"display:block;width:100%;max-width:536px;height:auto;border:0;border-radius:12px\">\n\u003cimg class=\"dk-only sm-img\" src=\"../assets/img/ph-thumb-shared-number-screen-dark.png\" width=\"536\" height=\"300\" alt=\"Illustration: Shared number screen\" style=\"display:block;width:100%;max-width:536px;height:auto;border:0;border-radius:12px;display:none;\">\u003c/td>\u003c/tr>\n\u003c/table>\u003c/td>\u003c/tr>\u003ctr>\u003ctd style=\"padding-bottom:24px;\">\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" class=\"dm-surface\" style=\"background:#eff0fe;border-radius:20px;table-layout:fixed;\">\n\u003ctr>\u003ctd class=\"sm-step-pad\" style=\"padding:24px 24px 20px;text-align:left;\">\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\u003ctr>\n\u003ctd width=\"44\" valign=\"top\" style=\"width:44px;padding-top:1px;\">\u003ctable role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\u003ctr>\u003ctd align=\"center\" class=\"dm-step-number\" width=\"28\" height=\"28\" style=\"background:#171a2b;color:#ffffff;border-radius:50%;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:28px;font-weight:600;\">3\u003c/td>\u003c/tr>\u003c/table>\u003c/td>\n\u003ctd valign=\"top\">\u003ch2 class=\"dm-text\" style=\"margin:0;font-family:'ES Rebond Grotesque','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:20px;line-height:1.4;font-weight:600;color:#171a2b;padding-bottom:0;text-align:left\">See the Full Context\u003c/h2>\u003c/td>\n\u003c/tr>\u003c/table>\n\u003cdiv style=\"padding-top:16px;\">\u003cp class=\"dm-text-2\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:0px\">No more “let me catch you up.” Calls, texts, and voicemails come together in one shared inbox, so your team always has the full context. Everyone can see what happened, who responded, and who took the call, so anyone can pick up where someone else left off.\u003c/p>\u003c/div>\n\n\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding:0 16px 16px;font-size:0;line-height:0;\">\n\u003c!-- IMAGE PLACEHOLDER [thumb] Shared inbox screen (536x300, 134:75)\n     Swap BOTH src values for the final artwork, exported at 2x (1072x600):\n       light  ->  https://YOUR-CDN/shared-inbox-screen.png\n       dark   ->  https://YOUR-CDN/shared-inbox-screen-dark.png\n     Keep the width and height attributes exactly as they are - they are what\n     stop the layout reflowing while the image loads.\n     If you only have one version, delete the second (.dk-only) image tag and\n     drop the .lt-only class; the remaining one shows in both themes.\n-->\n\u003cimg class=\"lt-only sm-img\" src=\"../assets/img/ph-thumb-shared-inbox-screen.png\" width=\"536\" height=\"300\" alt=\"Illustration: Shared inbox screen\" style=\"display:block;width:100%;max-width:536px;height:auto;border:0;border-radius:12px\">\n\u003cimg class=\"dk-only sm-img\" src=\"../assets/img/ph-thumb-shared-inbox-screen-dark.png\" width=\"536\" height=\"300\" alt=\"Illustration: Shared inbox screen\" style=\"display:block;width:100%;max-width:536px;height:auto;border:0;border-radius:12px;display:none;\">\u003c/td>\u003c/tr>\n\u003c/table>\u003c/td>\u003c/tr>\n\u003c/table>\n\u003cp class=\"dm-text-2\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:16px\">That's how a small team delivers service that feels big, coordinated, and personal.\u003c/p>\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"margin-bottom:20px;text-align:left;\">\n\u003ctr>\u003ctd style=\"padding:12px 0 20px;\">\u003ctable role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\u003ctr>\u003ctd width=\"36\" valign=\"middle\">\u003cimg class=\"lt-only\" src=\"../assets/img/icon-question.png\" width=\"24\" height=\"24\" alt=\"\" style=\"width:24px;height:24px;\">\u003cimg class=\"dk-only\" src=\"../assets/img/icon-question-dark.png\" width=\"24\" height=\"24\" alt=\"\" style=\"display:none;width:24px;height:24px;\">\u003c/td>\u003ctd>\u003ch2 class=\"dm-text sm-h2\" style=\"margin:0;font-family:'ES Rebond Grotesque','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:24px;line-height:1.2;font-weight:600;color:#171a2b;padding-top:0px;padding-bottom:0px\">Frequently asked questions\u003c/h2>\u003c/td>\u003c/tr>\u003c/table>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"dm-stroke\" style=\"padding:20px 0;border-top:1px solid #dfe1f8;\">\n\u003ch3 class=\"dm-text\" style=\"margin:0;font-family:'ES Rebond Grotesque','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:18px;line-height:1.45;font-weight:600;color:#171a2b;padding-bottom:12px;text-align:left\">What do team members have access to?\u003c/h3>\n\u003cp class=\"dm-text-2\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:0px\">Customer interactions are shared, including calls, texts, contacts, and tickets. Team members do not have access to admin controls like Auto Attendant and other business-level settings.\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"margin-bottom:20px;text-align:left;\">\n\n\u003ctr>\u003ctd class=\"dm-stroke\" style=\"padding:20px 0;border-top:1px solid #dfe1f8;\">\n\u003ch3 class=\"dm-text\" style=\"margin:0;font-family:'ES Rebond Grotesque','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:18px;line-height:1.45;font-weight:600;color:#171a2b;padding-bottom:12px;text-align:left\">What if a team member is off?\u003c/h3>\n\u003cp class=\"dm-text-2\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:0px\">Have the team member set their status to \"Offline\" in the app. If they use their phone's Do Not Disturb or Airplane Mode instead, their personal voicemail can answer the business call before it reaches the rest of your team.\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\n  \u003c/td>\u003c/tr>\n\u003c/table>\n\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n  \u003ctr>\u003ctd class=\"sm-px\" style=\"padding-top:24px;padding-bottom:0px;padding-left:20px;padding-right:20px;word-break:break-word\">\n\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"margin-bottom:0px;text-align:left;\">\u003ctr>\u003ctd class=\"dm-stroke\" style=\"border-top:1px solid #dfe1f8;padding:24px 0 8px;\">\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\u003ctr>\u003ctd width=\"60\" valign=\"top\" style=\"width:60px;\">\u003ctable role=\"    \u003c/td>\n  \u003c/tr>\n\u003c/table>\n\n\u003ctable role=\"presentation\" class=\"dm-card dm-stroke\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"table-layout:fixed;background-color:#ffffff;width:100%\">\n  \u003ctr>\u003ctd>\n\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\u003ctr>\u003ctd class=\"sm-px\" style=\"padding:0 20px;\">\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" class=\"dm-surface\" style=\"background:#eff0fe;border-radius:24px;overflow:hidden;\">\n\u003ctr>\u003ctd class=\"sm-hero-title\" align=\"center\" style=\"padding:28px 28px 12px;\">\u003ch1 class=\"dm-text sm-h1\" style=\"margin:0;font-family:'ES Rebond Grotesque','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:32px;line-height:1.2;font-weight:600;color:#171a2b;padding-bottom:0px\">There’s a lot more you can do with LinkedPhone.\u003c/h1>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"font-size:0;line-height:0;\">\u003cdiv class=\"hero-desktop\">\n\u003c!-- IMAGE PLACEHOLDER [hero] Feature overview hero (560x260, 28:13)\n     Swap BOTH src values for the final artwork, exported at 2x (1120x520):\n       light  ->  https://YOUR-CDN/feature-overview-hero.png\n       dark   ->  https://YOUR-CDN/feature-overview-hero-dark.png\n     Keep the width and height attributes exactly as they are - they are what\n     stop the layout reflowing while the image loads.\n     If you only have one version, delete the second (.dk-only) image tag and\n     drop the .lt-only class; the remaining one shows in both themes.\n-->\n\u003cimg class=\"lt-only sm-img\" src=\"../assets/img/ph-hero-feature-overview-hero.png\" width=\"560\" height=\"260\" alt=\"LinkedPhone Feature overview product illustration\" style=\"display:block;width:100%;max-width:560px;height:auto;border:0\">\n\u003cimg class=\"dk-only sm-img\" src=\"../assets/img/ph-hero-feature-overview-hero-dark.png\" width=\"560\" height=\"260\" alt=\"LinkedPhone Feature overview product illustration\" style=\"display:block;width:100%;max-width:560px;height:auto;border:0;display:none;\">\u003c/div>\u003c!--[if !mso]>\u003c!-->\u003cdiv class=\"hero-mobile\" style=\"display:none;max-height:0;overflow:hidden;mso-hide:all;\">\n\u003c!-- IMAGE PLACEHOLDER [hero] Feature overview hero mobile (335x260, 28:13)\n     Swap BOTH src values for the final artwork, exported at 2x (670x520):\n       light  ->  https://YOUR-CDN/feature-overview-hero-mobile.png\n       dark   ->  https://YOUR-CDN/feature-overview-hero-mobile-dark.png\n     Keep the width and height attributes exactly as they are - they are what\n     stop the layout reflowing while the image loads.\n     If you only have one version, delete the second (.dk-only) image tag and\n     drop the .lt-only class; the remaining one shows in both themes.\n-->\n\u003cimg class=\"lt-only sm-img\" src=\"../assets/img/ph-hero-feature-overview-hero-mobile.png\" width=\"335\" height=\"260\" alt=\"LinkedPhone Feature overview product illustration\" style=\"display:block;width:100%;max-width:335px;height:auto;border:0\">\n\u003cimg class=\"dk-only sm-img\" src=\"../assets/img/ph-hero-feature-overview-hero-mobile-dark.png\" width=\"335\" height=\"260\" alt=\"LinkedPhone Feature overview product illustration\" style=\"display:block;width:100%;max-width:335px;height:auto;border:0;display:none;\">\u003c/div>\u003c!--\u003c![endif]-->\u003c/td>\u003c/tr>\n\u003c/table>\u003c/td>\u003c/tr>\u003c/table>\n\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n  \u003ctr>\u003ctd class=\"sm-px\" style=\"padding-top:28px;padding-bottom:0px;padding-left:20px;padding-right:20px;word-break:break-word\">\n\u003cp class=\"dm-text\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.2;font-weight:500;color:#171a2b;padding-bottom:16px\">Hi {{first_name}},\u003c/p>\u003cp class=\"dm-text-2 sm-deck\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:0px\">By now, you’ve got the basics down. But there’s a lot more LinkedPhone can do to save you time, keep you organized, and help you take better care of customers. Here are a few features worth knowing about:\u003c/p>\n  \u003c/td>\u003c/tr>\n\u003c/table>\n\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n  \u003ctr>\u003ctd class=\"sm-px\" style=\"padding-top:24px;padding-bottom:0px;padding-left:20px;padding-right:20px;word-break:break-word\">\n\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"margin-bottom:28px;\">\n\u003ctr>\u003ctd class=\"dm-surface\" style=\"background:#eff0fe;border-radius:12px;padding:16px 20px;\">\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\u003ctr>\u003ctd>\u003ch2 class=\"dm-text sm-h2\" style=\"margin:0;font-family:'ES Rebond Grotesque','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:24px;line-height:1.2;font-weight:600;color:#171a2b;padding-top:0px;padding-bottom:0px\">Automate the Busywork\u003c/h2>\u003c/td>\u003ctd align=\"right\" class=\"dm-accent\" style=\"font-size:14px;font-weight:600;color:#3356ff;\">01\u003c/td>\u003c/tr>\u003c/table>\n\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"dm-stroke\" style=\"padding:18px 4px;border-bottom:1px solid #dfe1f8;\">\u003cp class=\"dm-text-2\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:6px\">\u003cstrong class=\"dm-text\" style=\"color:#171a2b\">Auto Replies\u003c/strong>\u003c/p>\u003cp class=\"dm-text-2\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:0px\">Can’t respond right away? Automatically send a text when you miss a call or receive a new message, so customers know you’ll get back to them.\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"dm-stroke\" style=\"padding:18px 4px;border-bottom:1px solid #dfe1f8;\">\u003cp class=\"dm-text-2\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:6px\">\u003cstrong class=\"dm-text\" style=\"color:#171a2b\">AI Reply Suggestions\u003c/strong>\u003c/p>\u003cp class=\"dm-text-2\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:0px\">Need help finding the right words? Get AI-powered suggestions for text replies based on the context of the conversation, then review, edit, or send.\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"dm-stroke\" style=\"padding:18px 4px;border-bottom:1px solid #dfe1f8;\">\u003cp class=\"dm-text-2\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:6px\">\u003cstrong class=\"dm-text\" style=\"color:#171a2b\">Lisa, Your AI Receptionist (Beta)\u003c/strong>\u003c/p>\u003cp class=\"dm-text-2\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:0px\">Lisa can answer calls, talk with customers, handle common questions, capture information, and route callers to the right person on your team.\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"dm-stroke\" style=\"padding:18px 4px;border-bottom:1px solid #dfe1f8;\">\u003cp class=\"dm-text-2\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:6px\">\u003cstrong class=\"dm-text\" style=\"color:#171a2b\">AI Call Summaries\u003c/strong>\u003c/p>\u003cp class=\"dm-text-2\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:0px\">Skip the note-taking. LinkedPhone can summarize your calls so you can quickly remember what was discussed and what happens next.\u003c/p>\u003c/td>\u003c/tr>\n\u003c/table>\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"margin-bottom:28px;\">\n\u003ctr>\u003ctd class=\"dm-surface\" style=\"background:#eff0fe;border-radius:12px;padding:16px 20px;\">\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\u003ctr>\u003ctd>\u003ch2 class=\"dm-text sm-h2\" style=\"margin:0;font-family:'ES Rebond Grotesque','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:24px;line-height:1.2;font-weight:600;color:#171a2b;padding-top:0px;padding-bottom:0px\">Call Handling\u003c/h2>\u003c/td>\u003ctd align=\"right\" class=\"dm-accent\" style=\"font-size:14px;font-weight:600;color:#3356ff;\">02\u003c/td>\u003c/tr>\u003c/table>\n\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"dm-stroke\" style=\"padding:18px 4px;border-bottom:1px solid #dfe1f8;\">\u003cp class=\"dm-text-2\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:6px\">\u003cstrong class=\"dm-text\" style=\"color:#171a2b\">Call Recording\u003c/strong>\u003c/p>\u003cp class=\"dm-text-2\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:0px\">Record business calls when you need a clear record of what was said.\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"dm-stroke\" style=\"padding:18px 4px;border-bottom:1px solid #dfe1f8;\">\u003cp class=\"dm-text-2\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:6px\">\u003cstrong class=\"dm-text\" style=\"color:#171a2b\">Call Transfer\u003c/strong>\u003c/p>\u003cp class=\"dm-text-2\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:0px\">Send a live call to another team member when they’re the right person to help. Your customer stays connected without having to hang up and call again.\u003c/p>\u003c/td>\u003c/tr>\n\u003c/table>\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"margin-bottom:28px;\">\n\u003ctr>\u003ctd class=\"dm-surface\" style=\"background:#eff0fe;border-radius:12px;padding:16px 20px;\">\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\u003ctr>\u003ctd>\u003ch2 class=\"dm-text sm-h2\" style=\"margin:0;font-family:'ES Rebond Grotesque','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:24px;line-height:1.2;font-weight:600;color:#171a2b;padding-top:0px;padding-bottom:0px\">Stay Organized and Grow\u003c/h2>\u003c/td>\u003ctd align=\"right\" class=\"dm-accent\" style=\"font-size:14px;font-weight:600;color:#3356ff;\">03\u003c/td>\u003c/tr>\u003c/table>\n\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"dm-stroke\" style=\"padding:18px 4px;border-bottom:1px solid #dfe1f8;\">\u003cp class=\"dm-text-2\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:6px\">\u003cstrong class=\"dm-text\" style=\"color:#171a2b\">Tickets\u003c/strong>\u003c/p>\u003cp class=\"dm-text-2\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:0px\">Turn a customer request into a ticket when something needs follow-up. Assign it to a team member, add notes and documents, and keep track of what needs to get done.\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"dm-stroke\" style=\"padding:18px 4px;border-bottom:1px solid #dfe1f8;\">\u003cp class=\"dm-text-2\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:6px\">\u003cstrong class=\"dm-text\" style=\"color:#171a2b\">Keep Your Existing Business Number\u003c/strong>\u003c/p>\u003cp class=\"dm-text-2\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:0px\">Already have a number your customers know? Port it to LinkedPhone whenever you’re ready and keep using it for business calls and texts.\u003c/p>\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"dm-stroke\" style=\"padding:18px 4px;border-bottom:1px solid #dfe1f8;\">\u003cp class=\"dm-text-2\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:6px\">\u003cstrong class=\"dm-text\" style=\"color:#171a2b\">Additional Phone Numbers\u003c/strong>\u003c/p>\u003cp class=\"dm-text-2\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:0px\">Need another number for the same business or a different one? Add more business numbers without adding another phone.\u003c/p>\u003c/td>\u003c/tr>\n\u003c/table>\u003cp class=\"dm-text-2\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:0px\">You don’t need to use everything at once. Start with the features that solve a problem for your business today, and come back to the others when you need them.\u003c/p>\n  \u003c/td>\u003c/tr>\n\u003c/table>\n\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n  \u003ctr>\u003ctd class=\"sm-px\" style=\"padding-top:24px;padding-bottom:0px;padding-left:20px;padding-right:20px;word-break:break-word\">\n\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"margin-bottom:0px;\">\u003ctr>\u003ctd class=\"dm-stroke\" style=\"border:1px solid #dfe1f8;border-radius:20px;padding:24px;\">\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\u003ctr>\u003ctd>\u003cimg class=\"lt-only\" src=\"../assets/img/icon-support.png\" width=\"32\" height=\"32\" alt=\"\" style=\"width:32px;height:32px;\">\u003cimg class=\"dk-only\" src=\"../assets/img/icon-support-dark.png\" width=\"32\" height=\"32\" alt=\"\" style=\"display:none;width:32px;height:32px;\">\u003c/td>\u003ctd align=\"right\">\u003ca href=\"https://www.linkedphone.com/quick-start-guide\" aria-label=\"Open Quick Start Guide\">\u003cimg class=\"lt-only\" src=\"../assets/img/icon-arrow.png\" width=\"24\" height=\"24\" alt=\"\" style=\"width:24px;height:24px;\">\u003cimg class=\"dk-only\" src=\"../assets/img/icon-arrow-dark.png\" width=\"24\" height=\"24\" alt=\"\" style=\"display:none;width:24px;height:24px;\">\u003c/a>\u003c/td>\u003c/tr>\u003c/table>\n\u003ch2 class=\"dm-text sm-h2\" style=\"margin:0;font-family:'ES Rebond Grotesque','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:24px;line-height:1.2;font-weight:600;color:#171a2b;padding-top:18px;padding-bottom:10px\">Want to go further?\u003c/h2>\n\u003cp class=\"dm-text-2\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:0px\">Check out our \u003ca href=\"https://www.linkedphone.com/quick-start-guide\" class=\"dm-accent\" style=\"color:#3356ff;text-decoration:underline;font-weight:500\">Quick Start Guide\u003c/a> to go deeper or jump ahead to other settings.\u003c/p>\n\u003c/td>\u003c/tr>\u003c/table>\n  \u003c/td>\u003c/tr>\n\u003c/table>\n\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n  \u003ctr>\u003ctd class=\"sm-px\" style=\"padding-top:28px;padding-bottom:32px;padding-left:20px;padding-right:20px;word-break:break-word\">\n\n\u003ch2 class=\"dm-text sm-h2\" style=\"margin:0;font-family:'ES Rebond Grotesque','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:24px;line-height:1.2;font-weight:600;color:#171a2b;padding-top:0px;padding-bottom:8px\">Need a hand?\u003c/h2>\u003cp class=\"dm-text-2\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:16px\">We're here to help.\u003c/p>\n\u003ctable role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n\u003ctr>\u003ctd style=\"padding:0 10px 14px 0;\">\u003cimg class=\"lt-only\" src=\"../assets/im cp class=\"dm-text-2 sm-deck\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:0px\">Here are the five settings that make the biggest difference in your first week. Each one takes a couple of minutes.\u003c/p>\n  \u003c/td>\u003c/tr>\n\u003c/table>\n\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n  \u003ctr>\u003ctd class=\"sm-px\" style=\"padding-top:24px;padding-bottom:0px;padding-left:20px;padding-right:20px;word-break:break-word\">\n\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n\u003ctr>\u003ctd style=\"padding-bottom:24px;\">\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" class=\"dm-surface\" style=\"background:#eff0fe;border-radius:20px;table-layout:fixed;\">\n\u003ctr>\u003ctd class=\"sm-step-pad\" style=\"padding:24px 24px 20px;text-align:left;\">\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\u003ctr>\n\u003ctd width=\"44\" valign=\"top\" style=\"width:44px;padding-top:1px;\">\u003ctable role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\u003ctr>\u003ctd align=\"center\" class=\"dm-step-number\" width=\"28\" height=\"28\" style=\"background:#171a2b;color:#ffffff;border-radius:50%;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:28px;font-weight:600;\">1\u003c/td>\u003c/tr>\u003c/table>\u003c/td>\n\u003ctd valign=\"top\">\u003ch2 class=\"dm-text\" style=\"margin:0;font-family:'ES Rebond Grotesque','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:20px;line-height:1.4;font-weight:600;color:#171a2b;padding-bottom:0;text-align:left\">Record your greetings\u003c/h2>\u003c/td>\n\u003c/tr>\u00 ttom:8px\">The mobile app and LinkedPhone Web.\u003c/td>\n  \u003c/tr>\n\u003c/table>\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"margin-bottom:0px;text-align:left;\">\n\u003ctr>\u003ctd style=\"padding:12px 0 20px;\">\u003ctable role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\u003ctr>\u003ctd width=\"36\" valign=\"middle\">\u003cimg class=\"lt-only\" src=\"../assets/img/icon-question.png\" width=\"24\" height=\"24\" alt=\"\" style=\"width:24px;height:24px;\">\u003cimg class=\"dk-only\" src=\"../assets/img/icon-question-dark.png\" width=\"24\" height=\"24\" alt=\"\" style=\"display:none;width:24px;height:24px;\">\u003c/td>\u003ctd>\u003ch2 class=\"dm-text sm-h2\" style=\"margin:0;font-family:'ES Rebond Grotesque','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:24px;line-height:1.2;font-weight:600;color:#171a2b;padding-top:0px;padding-bottom:0px\">Frequently asked questions\u003c/h2>\u003c/td>\u003c/tr>\u003c/table>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"dm-stroke\" style=\"padding:20px 0;border-top:1px solid #dfe1f8;\">\n\u003ch3 class=\"dm-text\" style=\"margin:0;font-family:'ES Rebond Grotesque','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:18px;line-height:1.45;font-weight:600;color:#171a2b;padding-bottom:12px;text-align:left\">Will my personal number be visible?\u003c/h3>\n\u003cp class=\"dm-text-2\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:0px\">No. Customers only ever see the business number. Your personal number stays private.\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\n  \u003c/td>\u003c/tr>\n\u003c/table>\n\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\n  \u003ctr>\u003ctd class=\"sm-px\" eight=\"20\" alt=\"\" style=\"display:none;width:20px;height:20px;\">\u003c/td>\u003ctd style=\"padding-bottom:14px;\">\u003ca href=\"mailto:support@linkedphone.com\" class=\"dm-accent\" style=\"color:#3356ff;text-decoration:underline;font-weight:500\">support@linkedphone.com\u003c/a>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd style=\"padding-right:10px;\">\u003cimg class=\"lt-only\" src=\"../assets/img/icon-call.png\" width=\"20\" height=\"20\" alt=\"\" style=\"width:20px;height:20px;\">\u003cimg class=\"dk-only\" src=\"../assets/img/icon-call-dark.png\" width=\"20\" height=\"20\" alt=\"\" style=\"display:none;width:20px;height:20px;\">\u003c/td>\u003ctd>\u003ca href=\"tel:+18775385888\" class=\"dm-accent\" style=\"color:#3356ff;text-decoration:underline;font-weight:500\">+1 (877) 538-5888\u003c/a>\u003c/td>\u003c/tr>\u003c/table>\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\u003ctr>\u003ctd class=\"dm-stroke\" style=\"padding-top:24px;\">\u003cdiv style=\"border-top:1px dashed #dfe1f8;\" class=\"dm-stroke\">\u003c/div>\u003c/td>\u003c/tr>\u003ctr>\u003ctd style=\"padding-top:24px;\">\u003cp class=\"dm-text-2\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:12px\">Welcome to the team,\u003c/p>\u003cp class=\"dm-text-2\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;font-weight:400;color:#444658;padding-bottom:0px\">\u003cstrong class=\"dm-text\" style=\"color:#171a2b;\">Team LinkedPhone\u003c/strong>\u003c/p>\u003c/td>\u003c/tr>\u003c/table>\n  \u003c/td>\u003c/tr>\n\u003c/table>\n\n  \u003c/td>\u003c/tr>\n\u003c/table>\n\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\u003ctr>\u003ctd class=\"sm-px\" style=\"padding:0 20px 24px;\">\n\u003ctable role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\">\u003ctr>\u003ctd class=\"dm-stroke\" style=\"padding-top:24px;border-top:1px solid #dfe1f8;\">\n\u003cp class=\"dm-text-3\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;line-height:1.5;font-weight:400;color:#5c5d71;padding-bottom:10px\">&copy; 2026 LinkedPhone. {{company_address}}\u003c/p>\n\u003cp class=\"dm-text-3\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;line-height:1.5;font-weight:400;color:#5c5d71;padding-bottom:10px\">This email was sent to {{email}} because of activity on your LinkedPhone account.\u003c/p>\n\u003cp class=\"dm-text-3\" style=\"margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;line-height:1.5;font-weight:600;color:#5c5d71\">\u003ca href=\"https://www.linkedphone.com/privacy-policy/\" class=\"dm-text-3\" style=\"color:#5c5d71;\">Privacy Policy\u003c/a>\u003c/p>\n\u003c/td>\u003c/tr>\u003c/table>\u003c/td>\u003c/tr>\u003c/table>\n        \u003c/div>\n        \u003c!--[if mso]>\u003c/td>\u003c/tr>\u003c/table>\u003c![endif]-->\n      \u003c/td>\n    \u003c/tr>\n  \u003c/table>\n\u003c/body>\n\u003c/html>","bytes":23666},{"dir":"transactional","slug":"04-10dlc-registration-required","subject":"Action required: register your number for texting (10DLC)","preheader":"US carriers require registration before business texting.","label":"Compliance","html":"\u003c!DOCTYPE html>\n\u003chtml lang=\"en\" xmlns=\"http://www.w3.org/1999/xhtml\" xmlns:v=\"urn:schemas-microsoft-com:vml\" xmlns:o=\"urn:schemas-microsoft-com:office:office\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n  \u003cmeta http-equiv=\"X-UA-Compatible\" content=\"IE=edge\">\n  \u003cmeta name=
