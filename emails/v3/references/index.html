<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V3 design and artwork</title><style>body{font:16px/1.6 Arial;color:#171a2b;background:#f4f5fa;max-width:1100px;margin:40px auto;padding:24px}a{color:#3356ff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px}figure{margin:0;padding:20px;background:white;border-radius:12px}img{width:100%;height:160px;object-fit:contain}small{color:#5c5d71}</style><a href="../../?version=v3">← V3 hub</a><h1>Approved design & artwork</h1><p>Reference layouts: <a href="../../final-consistency/day1a.html">Welcome</a> · <a href="../../final-consistency/day1b.html">First call</a> · <a href="../../final-consistency/day2.html">Greetings</a> · <a href="../../final-consistency/receipt.html">Receipt</a></p><p>All V3 raster assets live together in <code>v3/assets/img</code>. Existing V1 and V2 remain available in the hub. Onboarding artwork is populated first.</p><p id="progress"></p><div class="grid" id="assets"></div><script>fetch('../artwork.json').then(r=>r.json()).then(xs=>{document.querySelector('#progress').textContent=xs.filter(x=>x.ready).length+' of '+xs.length+' artwork assets ready';document.querySelector('#assets').innerHTML=xs.map(x=>'<figure><img src="../assets/img/'+(x.ready?x.id:'pending')+'.png" alt="'+x.id+'"><figcaption>'+x.id+'</figcaption><small>'+(x.ready?'Ready':'In progress')+'</small>'+(x.ready?'<br><a href="../assets/img/'+x.id+'.png">Full image ↗</a>':'')+'</figure>').join('')})</script></html>
